name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            DEPLOY_DIR="/home/goland/Teletriage"
            REPO_URL="https://github.com/michaelgoland1-GLD/Teletriage.git"
            
            # Setup directory dan clone jika belum ada
            if [ ! -d "$DEPLOY_DIR" ]; then
              mkdir -p "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
              git clone "$REPO_URL" .
            else
              cd "$DEPLOY_DIR"
              git fetch origin
              git reset --hard origin/main
            fi
            
            # Copy .env jika belum ada
            if [ ! -f ".env" ]; then
              if [ -f ".env.example" ]; then
                cp .env.example .env
                echo "⚠️  Copied .env.example to .env - configure manually if needed"
              else
                # Create minimal .env if no example exists
                cat > .env << 'EOF'
# Add your environment variables here
ENVIRONMENT=production
EOF
                echo "⚠️  Created new .env file - configure with your settings"
              fi
            fi
            
            # Stop old containers (suppress error if no containers exist)
            echo "🛑 Stopping old containers..."
            docker compose down || true
            
            # Build and start new containers
            echo "🚀 Building and starting new containers..."
            docker compose up -d --build
            
            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deployment complete!"
