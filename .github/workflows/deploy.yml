name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy via SSH
        env:
          SSH_KEY_BASE64: ${{ secrets.SERVER_SSHKEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          # Decode base64 key
          echo "$SSH_KEY_BASE64" | base64 -d > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          
          # Configure SSH
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Test SSH connection first
          ssh -i /tmp/ssh_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "echo 'SSH Connection OK'"
          
          # Deploy
          ssh -i /tmp/ssh_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'DEPLOY_SCRIPT'
          set -e
          DEPLOY_DIR="/home/goland/Teletriage"
          REPO_URL="https://github.com/michaelgoland1-GLD/Teletriage.git"
          
          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "Creating deployment directory..."
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            git clone "$REPO_URL" .
          else
            echo "Updating existing repository..."
            cd "$DEPLOY_DIR"
            git fetch origin
            git reset --hard origin/main
          fi
          
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo ".env created from .env.example"
            else
              echo "ENVIRONMENT=production" > .env
              echo ".env created with defaults"
            fi
          fi
          
          echo "Restarting Docker containers..."
          docker compose down || true
          docker compose up -d --build
          docker image prune -f
          
          echo "Deployment completed successfully!"
          DEPLOY_SCRIPT
          
          # Cleanup
          rm -f /tmp/ssh_key
