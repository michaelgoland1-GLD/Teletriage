name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSHKEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          # Decode base64 key
          echo "$SSH_KEY" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          
          # Add host to known_hosts
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          # Deploy commands
          ssh -i /tmp/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
          DEPLOY_DIR="/home/goland/Teletriage"
          REPO_URL="https://github.com/michaelgoland1-GLD/Teletriage.git"
          
          if [ ! -d "$DEPLOY_DIR" ]; then
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            git clone "$REPO_URL" .
          else
            cd "$DEPLOY_DIR"
            git fetch origin
            git reset --hard origin/main
          fi
          
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "Copied .env.example to .env"
            else
              echo "ENVIRONMENT=production" > .env
              echo "Created new .env file"
            fi
          fi
          
          echo "Stopping old containers..."
          docker compose down || true
          
          echo "Starting new containers..."
          docker compose up -d --build
          
          echo "Cleaning up old images..."
          docker image prune -f
          
          echo "Deployment completed successfully!"
          EOF
          
          # Cleanup
          rm -f /tmp/deploy_key
